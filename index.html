<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1146">
<title>Schwindler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: eine Spalte, ein Bildschirm pro Spielphase, Handy zuerst */
:root {
  --bg: #1d1146;
  --bg-deep: #120b33;
  --surface: rgba(255,255,255,.08);
  --surface-2: rgba(255,255,255,.15);
  --field: rgba(10,6,35,.5);
  --fg: #fff8f0;
  --muted: #cbbfee;
  --line: rgba(255,255,255,.2);
  --accent: #ffd23f;
  --accent-fg: #1d1146;
  --pink: #ff5fa2;
  --sky: #3fd0ff;
  --orange: #ff9a3d;
  --good: #2fe0b0;
  --bad: #ff4f6d;
  --font-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background:
    radial-gradient(60% 40% at 0% 0%, rgba(255,95,162,.45), transparent 70%),
    radial-gradient(55% 35% at 100% 18%, rgba(63,208,255,.35), transparent 70%),
    radial-gradient(60% 40% at 10% 100%, rgba(255,154,61,.35), transparent 70%),
    linear-gradient(170deg, #2c1470 0%, var(--bg) 50%, var(--bg-deep) 100%);
  background-attachment: fixed; background-color: var(--bg);
}
#app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.05; text-wrap: balance; }
h1 { font-size: 3.4rem; font-weight: 800; letter-spacing: -.03em; }
h2 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.01em; }
h3 { font-size: 1.1rem; font-weight: 800; }
p { margin: 0; }
.logo { background: linear-gradient(90deg, var(--accent), var(--pink) 55%, var(--sky)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.label { font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; }
.row > * { min-width: 0; }
.spread { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.panel { -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

button { font: inherit; color: inherit; cursor: pointer; }
.btn { border: 0; border-radius: 12px; padding: 15px 18px; font-weight: 700; font-size: 1.05rem; background: var(--accent); color: var(--accent-fg); box-shadow: 0 6px 0 rgba(0,0,0,.25); width: 100%; text-align: center; }
.btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.btn.ghost { background: var(--surface-2); color: var(--fg); box-shadow: none; }
.btn.small { width: auto; padding: 10px 14px; font-size: .95rem; box-shadow: none; }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input[type="text"] { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; width: 100%; min-width: 0; font-size: 1.05rem; }
input::placeholder { color: rgba(203,191,238,.6); }
.codefield { text-transform: uppercase; letter-spacing: .4em; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem !important; }

.code { font-family: var(--font-display); font-weight: 800; font-size: 4.2rem; letter-spacing: .12em; text-align: center; line-height: 1; padding-left: .12em; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { border: 0; background: var(--surface-2); width: 40px; height: 40px; border-radius: 10px; font-size: 1.3rem; font-weight: 700; }
.stepper button:disabled { opacity: .35; cursor: not-allowed; }
.stepper output { min-width: 3.4ch; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; font-variant-numeric: tabular-nums; }

.players { display: flex; flex-direction: column; gap: 8px; }
.player { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.player .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--good); flex: none; }
.player.off { opacity: .5; }
.player.off .dot { background: var(--muted); }
.player .nm { flex: 1; font-weight: 700; overflow-wrap: anywhere; }
.player .sc { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; }
.badge { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: var(--accent); color: var(--accent-fg); border-radius: 6px; padding: 2px 7px; }
.badge.ok { background: var(--good); }
.badge.soft { background: var(--surface-2); color: var(--fg); }

.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.timerbar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.timerbar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--sky), var(--accent), var(--pink)); transform-origin: left; }
.timernum { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; font-variant-numeric: tabular-nums; }

.question { font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; line-height: 1.15; overflow-wrap: anywhere; }
.blank { display: inline-block; min-width: 3.5em; border-bottom: 4px solid var(--accent); transform: translateY(-.1em); }
.cat { align-self: flex-start; }

.opt { width: 100%; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 15px 16px; font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; justify-content: space-between; gap: 10px; overflow-wrap: anywhere; }
.opt:disabled { cursor: default; }
.opt.mine { opacity: .5; border-style: dashed; }
.opt.picked { border-color: var(--accent); background: var(--surface-2); }
.opt.truth { border-color: var(--good); background: rgba(47,224,176,.18); }
.opt .by { font-size: .85rem; font-weight: 500; color: var(--muted); display: block; margin-top: 4px; }
.opt .txt { min-width: 0; }
.opt .tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.opt.picked .tick { background: var(--accent); border-color: var(--accent); }
.gain { font-family: var(--font-display); font-weight: 800; color: var(--good); font-variant-numeric: tabular-nums; }
.gain.zero { color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--bad); color: #fff; padding: 12px 16px; border-radius: 12px; font-weight: 700; max-width: min(92vw, 440px); z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.banner { background: var(--surface-2); border-radius: 10px; padding: 8px 12px; text-align: center; font-size: .9rem; }
.podium { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.podium.first { background: linear-gradient(135deg, var(--pink), var(--orange)); border-color: transparent; color: #fff; }
.podium .rank { font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; width: 1.6ch; text-align: center; }
.podium .nm { flex: 1; font-weight: 700; font-size: 1.15rem; overflow-wrap: anywhere; }
.podium .sc { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:active { transform: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden role="alert"></div>

<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');

  var S = { ws: null, open: false, st: null, session: null, offset: 0, drafts: {}, retry: 0, toastTimer: null };
  var urlCode = '';
  try { urlCode = (new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); } catch (e) {}

  function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function drop(k) { try { localStorage.removeItem(k); } catch (e) {} }
  S.session = load('schwindler-session');
  S.drafts.name = load('schwindler-name') || '';
  S.drafts.code = urlCode;

  // ---------- Hilfen ----------
  function h(tag, props) {
    var el = document.createElement(tag);
    var kids = Array.prototype.slice.call(arguments, 2);
    if (props) for (var k in props) {
      var v = props[k];
      if (v === false || v == null) continue;
      if (k === 'class') el.className = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
    kids.forEach(function add(c) {
      if (c == null || c === false) return;
      if (Array.isArray(c)) return c.forEach(add);
      el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
    });
    return el;
  }
  function send(o) { if (S.ws && S.open) S.ws.send(JSON.stringify(o)); }
  function toast(msg) {
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(S.toastTimer);
    S.toastTimer = setTimeout(function () { toastEl.hidden = true; }, 3500);
  }
  function me() { return S.st && S.st.players.filter(function (p) { return p.id === S.st.you; })[0]; }
  function isHost() { return S.st && S.st.host === S.st.you; }
  function nameOf(id) { var p = S.st.players.filter(function (x) { return x.id === id; })[0]; return p ? p.name : '?'; }
  function draftInput(id, props) {
    props = props || {};
    var after = props.after;
    delete props.after;
    props.id = id; props.type = 'text'; props.value = S.drafts[id] || '';
    props.oninput = function (e) { S.drafts[id] = e.target.value; if (id === 'name') save('schwindler-name', e.target.value); if (after) after(e); };
    return h('input', props);
  }
  function shareLink() { return location.origin + '/?code=' + S.st.code; }

  // ---------- Verbindung ----------
  function connect() {
    var proto = location.protocol === 'https:' ? 'wss' : 'ws';
    var ws = new WebSocket(proto + '://' + location.host + '/ws');
    S.ws = ws;
    ws.onopen = function () {
      S.open = true; S.retry = 0;
      if (S.session) send({ t: 'rejoin', code: S.session.code, pid: S.session.pid, token: S.session.token });
      render();
    };
    ws.onmessage = function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'joined') { S.session = { code: m.code, pid: m.pid, token: m.token }; save('schwindler-session', S.session); }
      else if (m.t === 'state') { S.st = m.state; S.offset = m.state.serverNow - Date.now(); render(); }
      else if (m.t === 'error') toast(m.msg);
      else if (m.t === 'rejoin_failed') { S.session = null; S.st = null; drop('schwindler-session'); render(); }
    };
    ws.onclose = function () {
      S.open = false; render();
      S.retry = Math.min(S.retry + 1, 6);
      setTimeout(connect, 600 * S.retry);
    };
    ws.onerror = function () {};
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && S.ws && S.ws.readyState > 1) connect();
  });

  // ---------- Bildschirme ----------
  function screenHome() {
    var nameOk = function () { return (S.drafts.name || '').trim().length > 0; };
    var codeOk = function () { return (S.drafts.code || '').length === 4; };
    var join = h('button', { class: 'btn', onclick: function () { send({ t: 'join', code: S.drafts.code, name: S.drafts.name }); } }, 'Beitreten');
    var create = h('button', { class: 'btn ghost', onclick: function () { send({ t: 'create', name: S.drafts.name }); } }, 'Neue Lobby erstellen');
    var sync = function () { join.disabled = !(S.open && nameOk() && codeOk()); create.disabled = !(S.open && nameOk()); };
    sync();
    return [
      h('div', { class: 'stack' },
        h('span', { class: 'label' }, 'Bluff-Partyspiel · 3 bis 12 Personen'),
        h('h1', { class: 'logo' }, 'Schwindler'),
        h('p', { class: 'muted' }, 'Denk dir eine Antwort aus, die echt klingt, und finde die wahre zwischen den Lügen deiner Freunde.')),
      h('section', { class: 'panel' },
        h('label', { class: 'label', for: 'name' }, 'Dein Name'),
        draftInput('name', { maxlength: 16, placeholder: 'Wie heißt du?', autocomplete: 'nickname', after: sync }),
        h('label', { class: 'label', for: 'code' }, 'Lobby-Code von deinen Freunden'),
        draftInput('code', { maxlength: 4, placeholder: 'ABCD', class: 'codefield', autocapitalize: 'characters', autocomplete: 'off', after: function (e) { var v = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); e.target.value = v; S.drafts.code = v; sync(); } }),
        join),
      h('div', { class: 'row' }, h('div', { class: 'muted small' }, 'Du bist der Erste? Dann erstelle eine Lobby und schick den Code an deine Freunde.')),
      create,
      !S.open ? h('div', { class: 'banner' }, 'Verbinde mit dem Server…') : null
    ];
  }

  function playerList(opts) {
    opts = opts || {};
    var st = S.st;
    var list = st.players.slice();
    if (opts.sort) list.sort(function (a, b) { return b.score - a.score; });
    return h('div', { class: 'players' }, list.map(function (p) {
      return h('div', { class: 'player' + (p.connected ? '' : ' off') },
        h('span', { class: 'dot' }),
        h('span', { class: 'nm' }, p.name + (p.id === st.you ? ' (du)' : '')),
        p.id === st.host ? h('span', { class: 'badge' }, 'Host') : null,
        opts.done && p.done ? h('span', { class: 'badge ok' }, 'fertig') : null,
        opts.score ? h('span', { class: 'sc' }, String(p.score)) : null,
        opts.gains && opts.gains[p.id] != null ? h('span', { class: 'gain' + (opts.gains[p.id] ? '' : ' zero') }, '+' + opts.gains[p.id]) : null);
    }));
  }

  function leaveButton() {
    return h('button', { class: 'btn ghost small', onclick: function () {
      send({ t: 'leave' });
      S.session = null; S.st = null; drop('schwindler-session'); render();
    } }, 'Lobby verlassen');
  }

  function screenLobby() {
    var st = S.st, s = st.settings, host = isHost();
    var connected = st.players.filter(function (p) { return p.connected; }).length;
    var ready = connected >= st.minPlayers;
    var copy = h('button', { class: 'btn ghost small', onclick: function () {
      var link = shareLink();
      var done = function () { copy.textContent = 'Kopiert'; setTimeout(function () { copy.textContent = 'Link kopieren'; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, function () { toast(link); });
      else toast(link);
    } }, 'Link kopieren');
    var wa = 'https://wa.me/?text=' + encodeURIComponent('Komm in meine Schwindler-Lobby! Code: ' + st.code + '\n' + shareLink());
    var settings = host
      ? h('section', { class: 'panel' },
          h('span', { class: 'label' }, 'Einstellungen'),
          stepRow('Fragen', 'Wie viele Runden gespielt werden', s.rounds, 3, 15, 1, function (v) { send({ t: 'settings', rounds: v }); }),
          stepRow('Schreibzeit', 'Sekunden zum Ausdenken', s.writeSecs, 20, 120, 10, function (v) { send({ t: 'settings', writeSecs: v }); }),
          stepRow('Abstimmzeit', 'Sekunden zum Raten', s.voteSecs, 15, 60, 5, function (v) { send({ t: 'settings', voteSecs: v }); }),
          h('div', { class: 'stack' }, h('span', { class: 'muted small' }, 'Themen'),
            h('div', { class: 'row wrap' }, st.allCats.map(function (c) {
              var on = s.cats.indexOf(c) >= 0;
              return h('button', { class: 'chip', 'aria-pressed': String(on), onclick: function () {
                var next = on ? s.cats.filter(function (x) { return x !== c; }) : s.cats.concat([c]);
                if (next.length) send({ t: 'settings', cats: next });
              } }, c);
            }))))
      : h('section', { class: 'panel' },
          h('span', { class: 'label' }, 'Einstellungen vom Host'),
          h('p', null, s.rounds + ' Fragen · ' + s.writeSecs + ' s schreiben · ' + s.voteSecs + ' s abstimmen'),
          h('p', { class: 'muted small' }, 'Themen: ' + s.cats.join(', ')));
    return [
      h('div', { class: 'stack' },
        h('span', { class: 'label' }, 'Lobby-Code'),
        h('div', { class: 'code', 'aria-label': 'Lobby-Code ' + st.code.split('').join(' ') }, st.code),
        h('div', { class: 'row wrap' }, copy,
          h('a', { class: 'btn ghost small', href: wa, target: '_blank', rel: 'noopener', style: 'text-decoration:none;text-align:center' }, 'In WhatsApp teilen'))),
      h('section', { class: 'panel' }, h('span', { class: 'label' }, 'Spieler (' + st.players.length + ')'), playerList()),
      settings,
      host
        ? h('button', { class: 'btn', disabled: !ready, onclick: function () { send({ t: 'start' }); } }, ready ? 'Spiel starten' : 'Noch ' + (st.minPlayers - connected) + ' Spieler fehlen')
        : h('div', { class: 'banner' }, 'Warte, bis ' + nameOf(st.host) + ' das Spiel startet.'),
      leaveButton()
    ];
  }
  function stepRow(title, sub, val, min, max, step, onChange) {
    return h('div', { class: 'row spread' },
      h('div', null, h('div', { style: 'font-weight:700' }, title), h('div', { class: 'muted small' }, sub)),
      h('div', { class: 'stepper' },
        h('button', { 'aria-label': title + ' verringern', disabled: val <= min, onclick: function () { onChange(Math.max(min, val - step)); } }, '−'),
        h('output', null, String(val)),
        h('button', { 'aria-label': title + ' erhöhen', disabled: val >= max, onclick: function () { onChange(Math.min(max, val + step)); } }, '+')));
  }

  function roundHeader() {
    var r = S.st.round;
    return h('div', { class: 'stack' },
      h('div', { class: 'top' },
        h('span', { class: 'label' }, 'Frage ' + r.n + ' von ' + r.total),
        S.st.endsAt ? h('span', { class: 'timernum', id: 'timernum' }, '') : null),
      S.st.endsAt ? h('div', { class: 'timerbar' }, h('i', { id: 'timerfill' })) : null);
  }
  function questionBlock() {
    var r = S.st.round, parts = r.q.split('_____');
    return h('div', { class: 'stack' },
      h('span', { class: 'badge soft cat' }, r.cat),
      h('div', { class: 'question' }, parts[0], h('span', { class: 'blank' }, ' '), parts.slice(1).join('_____')));
  }

  function screenWrite() {
    var st = S.st;
    var field, btn;
    if (st.mySubmitted) {
      return [roundHeader(), questionBlock(),
        h('section', { class: 'panel' },
          h('span', { class: 'label' }, 'Deine Lüge'),
          h('div', { class: 'question' }, st.myLie),
          h('p', { class: 'muted' }, 'Gesendet. Warte auf die anderen…')),
        h('section', { class: 'panel' }, playerList({ done: true }))];
    }
    var go = function () {
      var v = (S.drafts.lie || '').trim();
      if (!v) return toast('Schreib erst eine Antwort.');
      send({ t: 'answer', text: v });
    };
    btn = h('button', { class: 'btn', onclick: go }, 'Lüge abschicken');
    field = draftInput('lie', { maxlength: 40, placeholder: 'Deine erfundene Antwort', autocomplete: 'off', onkeydown: function (e) { if (e.key === 'Enter') go(); } });
    return [roundHeader(), questionBlock(),
      h('section', { class: 'panel' },
        h('label', { class: 'label', for: 'lie' }, 'Erfinde eine Antwort, die echt klingt'),
        field, btn,
        h('p', { class: 'muted small' }, 'Je glaubwürdiger deine Lüge, desto mehr Leute tippen darauf. Dafür gibt es Punkte.')),
      h('section', { class: 'panel' }, playerList({ done: true }))];
  }

  function screenVote() {
    var st = S.st, voted = !!st.myVote;
    return [roundHeader(), questionBlock(),
      h('div', { class: 'stack' },
        h('span', { class: 'label' }, voted ? 'Gewählt. Warte auf die anderen…' : 'Welche Antwort ist die richtige?'),
        st.options.map(function (o) {
          var picked = st.myVote === o.id;
          return h('button', { class: 'opt' + (o.mine ? ' mine' : '') + (picked ? ' picked' : ''), disabled: voted || o.mine,
            onclick: function () { send({ t: 'vote', option: o.id }); } },
            h('span', { class: 'txt' }, o.text, o.mine ? h('span', { class: 'by' }, 'Das ist deine Lüge') : null),
            h('span', { class: 'tick' }));
        })),
      h('section', { class: 'panel' }, playerList({ done: true }))];
  }

  function screenReveal() {
    var st = S.st, rv = st.reveal, host = isHost();
    var order = rv.options.slice().sort(function (a, b) { return (b.isTruth ? 1 : 0) - (a.isTruth ? 1 : 0); });
    return [
      h('div', { class: 'stack' },
        h('span', { class: 'label' }, 'Auflösung · Frage ' + st.round.n + ' von ' + st.round.total),
        h('h2', null, 'Richtig war: ' + rv.truth)),
      h('div', { class: 'stack' }, order.map(function (o) {
        var by = o.isTruth ? 'Die wahre Antwort' : o.byGame ? 'Vom Spiel erfunden' : 'Gelogen von ' + o.authors.join(' und ');
        return h('div', { class: 'opt' + (o.isTruth ? ' truth' : ''), style: 'cursor:default' },
          h('span', { class: 'txt' }, o.text,
            h('span', { class: 'by' }, by),
            h('span', { class: 'by' }, o.voters.length ? 'Gewählt von ' + o.voters.join(', ') : 'Niemand hat das gewählt')));
      })),
      h('section', { class: 'panel' }, h('span', { class: 'label' }, 'Punkte'), playerList({ sort: true, score: true, gains: rv.gains })),
      host
        ? h('button', { class: 'btn', onclick: function () { send({ t: 'next' }); } }, rv.last ? 'Endergebnis anzeigen' : 'Nächste Frage')
        : h('div', { class: 'banner' }, 'Gleich geht es weiter. ' + nameOf(st.host) + ' startet die nächste Frage.')
    ];
  }

  function screenFinal() {
    var st = S.st, host = isHost();
    return [
      h('div', { class: 'stack' }, h('span', { class: 'label' }, 'Endergebnis'),
        h('h2', null, st.ranking.length ? st.ranking[0].name + ' ist der größte Schwindler!' : 'Fertig')),
      h('div', { class: 'stack' }, st.ranking.map(function (r, i) {
        return h('div', { class: 'podium' + (i === 0 ? ' first' : '') },
          h('span', { class: 'rank' }, String(i + 1)),
          h('span', { class: 'nm' }, r.name + (r.id === st.you ? ' (du)' : '')),
          h('span', { class: 'sc' }, String(r.score)));
      })),
      host
        ? h('button', { class: 'btn', onclick: function () { send({ t: 'again' }); } }, 'Nochmal spielen')
        : h('div', { class: 'banner' }, 'Warte, bis ' + nameOf(st.host) + ' eine neue Runde startet.'),
      leaveButton()
    ];
  }

  // ---------- Rendern ----------
  function render() {
    var active = document.activeElement, focusId = active && active.id && app.contains(active) ? active.id : null;
    var pos = focusId && active.selectionStart != null ? [active.selectionStart, active.selectionEnd] : null;
    var kids;
    if (!S.st) kids = screenHome();
    else if (S.st.phase === 'lobby') kids = screenLobby();
    else if (S.st.phase === 'write') kids = screenWrite();
    else if (S.st.phase === 'vote') kids = screenVote();
    else if (S.st.phase === 'reveal') kids = screenReveal();
    else kids = screenFinal();
    if (S.st && !S.open) kids = [h('div', { class: 'banner' }, 'Verbindung weg. Ich versuche es nochmal…')].concat(kids);
    app.textContent = '';
    kids.forEach(function (k) { if (k) app.appendChild(k); });
    if (focusId) {
      var el = document.getElementById(focusId);
      if (el) { el.focus(); if (pos && el.setSelectionRange) try { el.setSelectionRange(pos[0], pos[1]); } catch (e) {} }
    }
    tick();
  }

  function tick() {
    var st = S.st;
    if (!st || !st.endsAt) return;
    var num = document.getElementById('timernum'), fill = document.getElementById('timerfill');
    if (!num || !fill) return;
    var left = Math.max(0, st.endsAt - (Date.now() + S.offset));
    var total = (st.phase === 'write' ? st.settings.writeSecs : st.settings.voteSecs) * 1000;
    num.textContent = Math.ceil(left / 1000) + ' s';
    fill.style.transform = 'scaleX(' + Math.max(0, Math.min(1, left / total)) + ')';
  }
  setInterval(tick, 250);

  render();
  connect();
})();
</script>
</body>
</html>
